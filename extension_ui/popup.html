<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Fraud Engine</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <h2>Fraud & Authenticity Audit</h2>
    
    <!-- State 1: Loading Spinner -->
    <div id="loading-state" class="center-content">
      <div class="spinner"></div>
      <p>Analyzing price anomalies & reviews...</p>
    </div>

    <!-- State 2: Active Results Display -->
    <div id="results-state" class="hidden">
      <!-- Risk Dial Indicator -->
      <div class="meter-container">
        <div id="risk-badge" class="risk-badge badge-safe">LOW RISK</div>
        <div class="score-display">
          <span id="risk-score">0</span><span class="max-score">/100</span>
        </div>
      </div>

      <!-- Anomaly Reason Breakdown List -->
      <div class="breakdown-section">
        <h3>Flagged Insights</h3>
        <ul id="reasons-list">
          <!-- Dynamically populated by popup.js -->
        </ul>
      </div>

      <button id="re-audit-btn" class="btn">Re-Audit Page</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
